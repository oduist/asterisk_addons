[test-app]
exten => 100,1,NoOp(Start)
same => n,Set(CHANNEL(hangup_handler_push)=test-hangup-handler,s,1)
same => n,Set(STARTTIME=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})
same => n,Answer
same => n,MixMonitor(test_call.wav)
same => n,Playback(one-moment-please)
same => n,Wait(1)
same => n,Hangup(16)

[test-hangup-handler]
exten => s,1,NoOp(Hangup handler for ${CHANNEL})
exten => s,n,Verbose(MIX ${MIXMONITOR_FILENAME})
exten => s,n,Set(CALLED=+1234567890)
exten => s,n,Set(CALLER=+987654321)
exten => s,n,System(/usr/bin/python3 /var/lib/asterisk/agi-bin/create_call.py MIXMONITOR_FILENAME="${MIXMONITOR_FILENAME}" UNIQUEID="${UNIQUEID}" CALLERID="${CALLER}" DNID="${CALLED}" STARTTIME="${STARTTIME}" ANSWEREDTIME="${ANSWEREDTIME}" DIALEDTIME="${DIALEDTIME}")
exten => s,n,Return()